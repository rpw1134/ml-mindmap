<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="none"/>

  <!-- Simple MLP: Input -> Output (no hidden layer) -->
  <line x1="45" y1="60" x2="155" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.7"/>
  <line x1="45" y1="60" x2="155" y2="130" stroke="#3B82F6" stroke-width="2" opacity="0.7"/>
  <line x1="45" y1="100" x2="155" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.7"/>
  <line x1="45" y1="100" x2="155" y2="130" stroke="#3B82F6" stroke-width="2" opacity="0.7"/>
  <line x1="45" y1="140" x2="155" y2="70" stroke="#3B82F6" stroke-width="2" opacity="0.7"/>
  <line x1="45" y1="140" x2="155" y2="130" stroke="#3B82F6" stroke-width="2" opacity="0.7"/>

  <!-- Input Nodes -->
  <circle cx="45" cy="60" r="10" fill="#3B82F6" stroke="#1E40AF" stroke-width="2"/>
  <circle cx="45" cy="100" r="10" fill="#3B82F6" stroke="#1E40AF" stroke-width="2"/>
  <circle cx="45" cy="140" r="10" fill="#3B82F6" stroke="#1E40AF" stroke-width="2"/>

  <!-- Output Nodes -->
  <circle cx="155" cy="70" r="12" fill="#10B981" stroke="#059669" stroke-width="2"/>
  <circle cx="155" cy="130" r="12" fill="#10B981" stroke="#059669" stroke-width="2"/>
</svg>